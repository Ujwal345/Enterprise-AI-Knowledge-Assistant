apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-ai-frontend
  template:
    metadata:
      labels:
        app: enterprise-ai-frontend
    spec:
      containers:
        - name: frontend
          image: enterprise-ai-assistant-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://enterprise-ai-backend:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-frontend
spec:
  selector:
    app: enterprise-ai-frontend
  ports:
    - port: 8501
      targetPort: 8501
  type: NodePort
