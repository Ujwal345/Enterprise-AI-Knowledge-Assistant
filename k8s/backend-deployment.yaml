apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-ai-backend
  template:
    metadata:
      labels:
        app: enterprise-ai-backend
    spec:
      containers:
        - name: backend
          image: enterprise-ai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OLLAMA_HOST
              value: "http://host.docker.internal:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-backend
spec:
  selector:
    app: enterprise-ai-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: NodePort
